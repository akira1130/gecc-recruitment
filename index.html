<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GECC - Recruitment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .container { max-width: 600px; margin: 50px auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: #333; font-size: 2em; margin-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; }
        textarea { resize: vertical; min-height: 100px; }
        button { background: #6366f1; color: white; padding: 12px 30px; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; width: 100%; }
        button:hover { background: #4f46e5; }
        .success { color: #22c55e; padding: 10px; background: #f0fdf4; border-radius: 4px; display: none; margin-bottom: 20px; }
        .error { color: #ef4444; padding: 10px; background: #fef2f2; border-radius: 4px; display: none; margin-bottom: 20px; }
        .checkbox-group { display: flex; align-items: center; }
        .checkbox-group input { width: auto; margin-right: 10px; }
        .file-input-label { cursor: pointer; padding: 20px; background: white; border: 2px dashed #ddd; border-radius: 4px; text-align: center; transition: all 0.3s; }
        .file-input-label:hover { border-color: #6366f1; background: #f9f3ff; }
        .file-input-label.selected { border-color: #22c55e; background: #f0fdf4; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>GECC Recruitment</h1>
            <p>Apply to join our team</p>
        </div>

        <div class="success" id="successMsg">Application submitted successfully!</div>
        <div class="error" id="errorMsg"></div>

        <form id="applicationForm">
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone *</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="form-group">
                <label for="experience">Experience Level *</label>
                <select id="experience" name="experience" required>
                    <option value="">Select...</option>
                    <option value="0-1">0-1 years</option>
                    <option value="1-3">1-3 years</option>
                    <option value="3-5">3-5 years</option>
                    <option value="5+">5+ years</option>
                </select>
            </div>

            <div class="form-group">
                <label for="background">Background *</label>
                <textarea id="background" name="background" placeholder="Tell us about your experience..." required minlength="50"></textarea>
            </div>

            <div class="form-group">
                <label for="resume">Resume (PDF, DOC, DOCX) *</label>
                <label for="resume" class="file-input-label" id="fileLabel">
                    <div>📄 Click to upload or drag & drop</div>
                    <div style="font-size: 0.9em; color: #666; margin-top: 5px;" id="fileName">No file selected</div>
                </label>
                <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms" style="margin: 0;">I agree to the terms</label>
            </div>

            <button type="submit">Submit Application</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('applicationForm');
        const fileInput = document.getElementById('resume');
        const fileLabel = document.getElementById('fileLabel');
        const fileName = document.getElementById('fileName');
        const successMsg = document.getElementById('successMsg');
        const errorMsg = document.getElementById('errorMsg');

        // File input handling
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                fileName.textContent = e.target.files[0].name;
                fileLabel.classList.add('selected');
            }
        });

        fileLabel.addEventListener('click', () => fileInput.click());

        // Drag and drop
        fileLabel.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileLabel.style.borderColor = '#6366f1';
        });

        fileLabel.addEventListener('dragleave', () => {
            fileLabel.style.borderColor = '#ddd';
        });

        fileLabel.addEventListener('drop', (e) => {
            e.preventDefault();
            fileLabel.style.borderColor = '#ddd';
            if (e.dataTransfer.files[0]) {
                fileInput.files = e.dataTransfer.files;
                fileName.textContent = e.dataTransfer.files[0].name;
                fileLabel.classList.add('selected');
            }
        });

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';

            const formData = new FormData(form);
            
            try {
                const response = await fetch('/api/apply', {
                    method: 'POST',
                    body: formData
                });

                console.log('Response status:', response.status);
                const text = await response.text();
                console.log('Response text:', text);

                const data = JSON.parse(text);

                if (data.success) {
                    successMsg.style.display = 'block';
                    form.reset();
                    fileName.textContent = 'No file selected';
                    fileLabel.classList.remove('selected');
                } else {
                    errorMsg.textContent = data.message || 'Error submitting form';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error('Fetch error:', error);
                errorMsg.textContent = 'Error: ' + error.message;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>

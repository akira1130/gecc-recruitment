<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GECC - Apply Now</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; line-height: 1.6; }
        .container { max-width: 500px; margin: 40px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #1a202c; margin-bottom: 10px; text-align: center; }
        p { color: #718096; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: #2d3748; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 4px; font-family: inherit; font-size: 1em; }
        textarea { resize: vertical; min-height: 100px; }
        button { width: 100%; background: #667eea; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 1em; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #5568d3; }
        button:disabled { background: #cbd5e0; cursor: not-allowed; }
        .alert { padding: 12px; border-radius: 4px; margin-bottom: 20px; display: none; }
        .alert.success { background: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
        .alert.error { background: #fed7d7; color: #742a2a; border: 1px solid #fc8181; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GECC Recruitment</h1>
        <p>Join our team of talented educators</p>

        <div id="success" class="alert success">✓ Application submitted successfully!</div>
        <div id="error" class="alert error"></div>

        <form id="form">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" name="fullName" required>
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Phone *</label>
                <input type="tel" name="phone" required>
            </div>

            <div class="form-group">
                <label>Experience *</label>
                <select name="experience" required>
                    <option value="">Select...</option>
                    <option value="0-1">0-1 years</option>
                    <option value="1-3">1-3 years</option>
                    <option value="3-5">3-5 years</option>
                    <option value="5+">5+ years</option>
                </select>
            </div>

            <div class="form-group">
                <label>Background *</label>
                <textarea name="background" placeholder="Tell us about yourself..." minlength="50" required></textarea>
            </div>

            <div class="form-group">
                <label>Resume (PDF, DOC, DOCX) *</label>
                <input type="file" name="resume" accept=".pdf,.doc,.docx" required>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" name="terms" required style="width: auto; margin-right: 8px;">
                    I agree to the terms
                </label>
            </div>

            <button type="submit">Submit Application</button>
        </form>
    </div>

    <script>
        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const form = e.target;
            const success = document.getElementById('success');
            const error = document.getElementById('error');
            const btn = form.querySelector('button');
            
            success.style.display = 'none';
            error.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Submitting...';

            try {
                const formData = new FormData(form);
                const response = await fetch('/submit.php', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.success) {
                    success.style.display = 'block';
                    form.reset();
                    btn.textContent = 'Submit Application';
                } else {
                    error.textContent = data.message || 'Error submitting form';
                    error.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Submit Application';
                }
            } catch (err) {
                error.textContent = 'Error: ' + err.message;
                error.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Submit Application';
            }
        });
    </script>
</body>
</html>
